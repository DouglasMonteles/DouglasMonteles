<article class="flex flex-col gap-4 lg:gap-8">
  <h1 class="text-4xl font-normal">
    Sobre
  </h1>

  <div class="flex flex-col gap-4">
    @if (($about() | async); as about) {
      @for (paragraph of about.paragraphs; track $index) {
        <p class="font-normal text-justify lg:text-lg">
          {{paragraph}}
        </p>
      }
    }
  </div>
</article>
