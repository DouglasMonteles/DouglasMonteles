<article>
  <div class="">
    <ol class="">
      @for (proj of ($projects() | async); track $index) {
        <li class="mb-12">
          <app-proj-card
            [projectName]="proj.name"
            [projectDescription]="proj.description || 'Sem descrição :('"
            [projectLink]="proj.homepage"
            [projectRepositoryLink]="proj.html_url"
            [projectStars]="proj.stargazers_count"
            [projectImage]="'https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png'"
            [tags]="proj.topics"
          />
        </li>
      }
    </ol>
  </div>
</article>
