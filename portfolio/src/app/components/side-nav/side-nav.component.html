<mat-sidenav-container class="sidenav-container">
  @if ((isHandset$ | async) === true) {
    <mat-sidenav 
      #drawer 
      class="sidenav" 
      fixedInViewport 
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'" 
      [opened]="(isHandset$ | async) === false"
    >
      <mat-toolbar class="teste">Menu</mat-toolbar>
      <mat-nav-list>
        @for (item of menuList(); track $index) {
          <a 
            mat-list-item 
            [routerLink]="item.link"
            [activated]="item.active"
            (click)="updateMenuLinkActive($index)"
          >
            {{item.name}}
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>
  }
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button type="button" aria-label="Toggle sidenav" matIconButton (click)="toggleSideMenu()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <div class="w-full flex items-center justify-end mx-8">
        <app-slide-toggle />
      </div>
    </mat-toolbar>
    <!-- Add Content Here -->
    <ng-content />
  </mat-sidenav-content>
</mat-sidenav-container>
