<footer class="mb-8 sm:mb-8">
  <ul 
    class="ml-1 mt-8 flex items-center" 
    aria-label="Social media"
  >
    @for (sm of ($socialMedia() | async); track $index) {
      <li class="mr-5 shrink-0 text-xs">
        <app-footer-link 
          [text]="sm.name"
          [link]="sm.link"
        >
          <svg 
            xmlns="http://www.w3.org/2000/svg" 
            [attr.viewBox]="sm.svgIcon.viewBox"
            fill="currentColor" 
            class="h-6 w-6" 
            aria-hidden="true"
          >
            <path [attr.d]="sm.svgIcon.path"></path>
          </svg>
        </app-footer-link>
      </li>
    }
  </ul>
</footer>
